# 项目相关配置
ruoyi:
  # 名称
  name: RuoYi
  # 版本
  version: 3.6.0
  # 版权年份
  copyrightYear: 2021
  # 实例演示开关
  demoEnabled: true
  # 文件路径 使用环境变量，避免重复配置
  profile: ${HOME}/NuoYi/upload
  # 获取ip地址开关
  addressEnabled: false
  # 验证码类型 math 数组计算 char 字符验证
  captchaType: math

# 开发环境配置
server:
  # 服务器的HTTP端口，默认为8080
  port: 8080
  servlet:
    # 应用的访问路径
    context-path: /
  tomcat:
    # tomcat的URI编码
    uri-encoding: UTF-8
    # tomcat最大线程数，默认为200
    max-threads: 800
    # Tomcat启动初始化的线程数，默认值25
    min-spare-threads: 30

# 日志配置
logging:
  level:
    com.ruoyi: debug
    org.springframework: warn

# Spring配置
spring:
  # 资源信息
  messages:
    # 国际化资源文件路径
    basename: i18n/messages
  profiles:
    active: druid
  # 文件上传
  servlet:
    multipart:
      # 单个文件大小
      max-file-size: 2GB
      # 设置总上传的文件大小
      max-request-size: 2GB
  # 服务模块
  devtools:
    restart:
      # 热部署开关
      enabled: true
  # redis 配置
  redis:
    # 地址
    host: ${REDIS_HOST:127.0.0.1}
    # 端口，默认为6379
    port: ${REDIS_PORT:6379}
    # 数据库索引
    database: ${REDIS_DATABASE:0}
    # 密码
    password: ${REDIS_PASSWORD:}
    # 连接超时时间
    timeout: 10s
    lettuce:
      pool:
        # 连接池中的最小空闲连接
        min-idle: 0
        # 连接池中的最大空闲连接
        max-idle: 8
        # 连接池的最大数据库连接数
        max-active: 8
        # #连接池最大阻塞等待时间（使用负值表示没有限制）
        max-wait: -1ms
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:9092}
    consumer:
      auto-offset-reset: latest
      max-poll-records: 200
      auto-commit-interval: 1000
      #自动提交的间隔时间
      session-timeout: 20000
      #连接超时时间
      max-poll-interval: 15000
      #手动提交设置与poll的心跳数,如果消息队列中没有消息，等待毫秒后，调用poll()方法。如果队列中有消息，立即消费消息，每次消费的消息的多少可以通过max.poll.records配置。
      max-partition-fetch-bytes: 15728640
      #设置拉取数据的大小,15M

#        key-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
#        value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
  #rocketmq:
  #  name-server: 127.0.0.1:9876
  #  consumer:
  #    group: xttx_consumer_group
  autoconfigure:
    exclude:
      # 排除RocketMQ核心自动配置类，阻止相关Bean初始化
      - org.apache.rocketmq.spring.autoconfigure.RocketMQAutoConfiguration
      #- org.apache.rocketmq.spring.autoconfigure.RocketMQTransactionAutoConfiguration

es:
  host: ${ES_HOST:127.0.0.1}
  port: 9200
  scheme: http

# 业务服务地址与路径配置（均支持环境变量覆盖）
infer:
  # 推理服务地址
  base-url: ${INFER_BASE_URL:http://127.0.0.1:8000}
edge:
  # 边缘辅助服务地址
  base-url: ${EDGE_BASE_URL:http://127.0.0.1:8888/}
sensor:
  # 探针脚本根目录
  root-path: ${SENSOR_ROOT_PATH:/root/sensor}
  # 探针提取文件目录
  extract-dir: ${SENSOR_EXTRACT_DIR:/root/sensor/extract_files}
pcap:
  # 离线 pcap 上传目录
  dir: ${PCAP_DIR:/root/pcap}
model:
  # 模型解压目录
  models-dir: ${MODEL_MODELS_DIR:/root/Model/models/}

# token配置
token:
  # 令牌自定义标识
  header: Authorization
  # 令牌密钥
  secret: ${JWT_SECRET}
  # 令牌有效期（默认30分钟）
  expireTime: 300

# MyBatis配置
mybatis:
  # 搜索指定包别名
  typeAliasesPackage: com.ruoyi.**.domain
  # 配置mapper的扫描，找到所有的mapper.xml映射文件
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  # 加载全局的配置文件
  configLocation: classpath:mybatis/mybatis-config.xml

# PageHelper分页插件
pagehelper:
  helperDialect: mysql
  supportMethodsArguments: true
  params: count=countSql

# Swagger配置
swagger:
  # 是否开启swagger
  enabled: true
  # 请求前缀
  pathMapping: /dev-api

# 防止XSS攻击
xss:
  # 过滤开关
  enabled: true
  # 排除链接（多个用逗号分隔）
  excludes: /system/notice
  # 匹配链接
  urlPatterns: /system/*,/monitor/*,/tool/*
